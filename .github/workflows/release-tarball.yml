name: release tarball

# On every published GitHub release, build the package archive from the tagged
# commit, verify its contents, and attach `dsh-superpowers-<version>.tgz` plus a
# `SHA256SUMS` file to the release. The archive is the same one `npm publish`
# would upload and is installable with:
#   dsh plugin --profile web add ./dsh-superpowers-<version>.tgz
# `workflow_dispatch` builds the archive without touching a release and keeps it
# as a workflow artifact, for dry runs.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-tarball-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Build and publish the tarball
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # The pnpm version comes from package.json's `packageManager` field.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build and pack
        run: pnpm pack

      - name: Verify the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${TAG#v}"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag '$TAG' does not match package.json version '$pkg'" >&2
            exit 1
          fi

      - name: Verify the tarball contains the installable bundle
        run: |
          set -euo pipefail
          tgz="$(ls dsh-superpowers-*.tgz)"
          for path in package/package.json package/cordis.patch.yml package/lib/index.js \
                      package/skills/using-superpowers/SKILL.md package/upstream/superpowers.lock.json; do
            tar -tzf "$tgz" | grep -qx "$path"
          done
          echo "verified $tgz"

      - name: Write checksums
        run: |
          sha256sum dsh-superpowers-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attach the tarball to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dsh-superpowers-*.tgz SHA256SUMS --clobber

      - name: Keep the tarball as a workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-superpowers-tarball
          path: |
            dsh-superpowers-*.tgz
            SHA256SUMS
          if-no-files-found: error
