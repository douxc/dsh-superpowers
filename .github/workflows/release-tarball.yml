name: release tarball

# Build the installable package archive and attach it to a GitHub release.
#
# Triggers:
#   * `release: published` — the normal path: build from the release tag and
#     attach `dsh-superpowers-<version>.tgz` + `SHA256SUMS` to that release.
#   * `workflow_dispatch` with a `tag` input — rebuild and re-attach the assets
#     of an existing release (useful to retry a failed release run without
#     deleting the release). Leave the input empty to only build a workflow
#     artifact from the dispatch ref.
#
# The archive is the same package `npm publish` would upload, and is installed
# with: dsh plugin --profile web add ./dsh-superpowers-<version>.tgz
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and attach assets to (e.g. v0.0.1). Empty = build an artifact only.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-tarball-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Build and publish the tarball
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the target ref
        id: target
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          FALLBACK_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RELEASE_TAG:-}}"
          if [ -n "$tag" ]; then
            ref="refs/tags/$tag"
          else
            ref="$FALLBACK_REF"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building $ref (attach tag: ${tag:-none})"

      - name: Check out the target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # The pnpm version comes from package.json's `packageManager` field.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build and pack
        run: pnpm pack

      - name: Verify the release tag matches the package version
        if: steps.target.outputs.tag != ''
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${TAG#v}"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag '$TAG' does not match package.json version '$pkg'" >&2
            exit 1
          fi

      - name: Verify the tarball contains the installable bundle
        run: |
          set -euo pipefail
          tgz="$(ls dsh-superpowers-*.tgz)"
          # Read the archive listing to a file first. Piping `tar -tzf` into
          # `grep -q` makes grep exit on the first match and close the pipe;
          # GNU tar then dies with "stdout: write error" (exit 2) and
          # `set -o pipefail` turns that into a failed step.
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          tar -tzf "$tgz" > "$listing"
          for path in package/package.json package/cordis.patch.yml package/lib/index.js \
                      package/skills/using-superpowers/SKILL.md package/upstream/superpowers.lock.json; do
            if ! grep -qx -- "$path" "$listing"; then
              echo "missing $path in $tgz" >&2
              exit 1
            fi
          done
          echo "verified $tgz ($(wc -l < "$listing") files)"

      - name: Write checksums
        run: |
          sha256sum dsh-superpowers-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attach the tarball to the GitHub release
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: gh release upload "$TAG" dsh-superpowers-*.tgz SHA256SUMS --clobber

      - name: Keep the tarball as a workflow artifact
        if: steps.target.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: dsh-superpowers-tarball
          path: |
            dsh-superpowers-*.tgz
            SHA256SUMS
          if-no-files-found: error
